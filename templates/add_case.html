{% extends "layout.html" %}
{% block title %}New Case — ECMS{% endblock %}
{% block page_title %}New Case{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">Create Case</div>
        <div class="page-subtitle">Register a new investigative case</div>
    </div>
</div>
<div style="max-width:600px;">
    <div class="card">
        <div class="card-header"><div class="card-title">Case Details</div></div>
        <div class="card-body">
            <form method="POST" action="/cases/add">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" name="title" class="form-control" placeholder="Case title" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" placeholder="Scope, context, and relevant background…"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-control" required>
                        <option value="open">Open</option>
                        <option value="closed">Closed</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
                <div style="display:flex;gap:10px;margin-top:4px;">
                    <button type="submit" class="btn btn-primary">Create Case</button>
                    <a href="/cases" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <div class="info-box info mt-16"><span>ℹ</span><span>Creates records in PostgreSQL and a case node in Neo4j simultaneously.</span></div>
</div>
{% endblock %}
